# بناء ملف الواجهة بطريقة الطباعة المباشرة وإصلاح مشكلة getrandom
      - name: Build Web Bundle
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          TARGET_DIR="apps/bimcraft" ;
          if [ -d "apps/bimcraft-web" ]; then TARGET_DIR="apps/bimcraft-web"; fi ;
          if [ -d "apps/web" ]; then TARGET_DIR="apps/web"; fi ;
          
          echo "Moving to $TARGET_DIR" ;
          cd "$TARGET_DIR" ;
          
          if [ ! -f "index.html" ]; then
            echo "Generating index.html..." ;
            echo "<!DOCTYPE html>" > index.html ;
            echo "<html><head><meta charset=\"utf-8\"><title>BIMcraft</title>" >> index.html ;
            echo "<style>html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; } canvas { display: block; width: 100%; height: 100%; }</style>" >> index.html ;
            echo "</head><body>" >> index.html ;
            echo "<canvas id=\"the_canvas_id\"></canvas>" >> index.html ;
            echo "<link data-trunk rel=\"rust\" data-wasm-opt=\"s\" />" >> index.html ;
            echo "</body></html>" >> index.html ;
          fi ;
          
          echo "Patching getrandom for WebAssembly..." ;
          cargo add getrandom --features js ;
          
          trunk build --release ;
          
          cd "$GITHUB_WORKSPACE" ;
          mkdir -p www ;
          if [ -d "$TARGET_DIR/dist/web" ]; then cp -r "$TARGET_DIR/dist/web/"* www/ ;
          elif [ -d "$TARGET_DIR/dist" ]; then cp -r "$TARGET_DIR/dist/"* www/ ;
          else cp -r dist/* www/ || true ;
          fi ;
