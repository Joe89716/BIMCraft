name: Build BIMcraft APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Rust & WASM
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Install Trunk & Image Tools
        run: |
          cargo install --locked trunk
          sudo apt-get update && sudo apt-get install -y imagemagick

      # 1. خفض قيود الرسوميات (WGPU) بأمان تام لدعم الـ 3D المعماري
      - name: Patch GPU Limits for BIMcraft
        run: |
          echo "Patching WGPU texture limit to 4096..."
          find apps crates -type f -name "*.rs" -exec sed -i 's/8192/4096/g' {} + || true
          
          python3 -c '
          import os, glob
          for path in glob.glob("**/*.rs", recursive=True):
              if "target/" in path: continue
              with open(path, "r") as f:
                  content = f.read()
              if "wgpu_options" in content or "WebOptions" in content or "eframe::WebRunner" in content:
                  content = content.replace("wgpu::Limits::default()", "wgpu::Limits::downlevel_defaults()")
                  content = content.replace("wgpu::Limits::downlevel_webgl2_defaults()", "wgpu::Limits::downlevel_defaults()")
                  with open(path, "w") as f:
                      f.write(content)
          '

      # 2. البحث التلقائي عن تطبيق الويب وبناء الحزمة
      - name: Build Web Bundle
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          # العثور التلقائي على المجلد الذي يحتوي على index.html الخاص بالويب
          INDEX_PATH=$(find . -name "index.html" -not -path "*/target/*" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$INDEX_PATH" ]; then
            echo "Error: index.html not found!"
            exit 1
          fi
          
          WEB_DIR=$(dirname "$INDEX_PATH")
          echo "Found Web Directory at: $WEB_DIR"
          
          cd "$WEB_DIR"
          trunk build --release
          cd "$GITHUB_WORKSPACE"
          
          mkdir -p www
          # نقل مخرجات البناء أياً كان المسار
          if [ -d "$WEB_DIR/dist/web" ]; then
            cp -r "$WEB_DIR/dist/web/"* www/
          elif [ -d "$WEB_DIR/dist" ]; then
            cp -r "$WEB_DIR/dist/"* www/
          else
            cp -r dist/* www/
          fi

      # 3. إعداد Capacitor للأندرويد
      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "BIMcraft" "com.craft.bimcraft" --web-dir "www"
          npx cap add android
          npx cap sync android

      # 4. تفعيل التسريع العتادي
      - name: Enable Hardware Acceleration
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application /<application android:hardwareAccelerated="true" android:largeHeap="true" /g' "$MANIFEST"

      # 5. استخراج الأيقونة
      - name: Enforce BIMcraft Official Icon
        run: |
          ICON_SRC=""
          if [ -f "packaging/bimcraft.png" ]; then
            ICON_SRC="packaging/bimcraft.png"
          elif [ -f "assets/app-icon/icon.png" ]; then
            ICON_SRC="assets/app-icon/icon.png"
          elif [ -f "assets/icon.png" ]; then
            ICON_SRC="assets/icon.png"
          fi

          if [ -n "$ICON_SRC" ]; then
            RES_DIR="android/app/src/main/res"
            rm -rf "$RES_DIR"/mipmap-anydpi-v26
            rm -f "$RES_DIR"/drawable/ic_launcher_background.xml
            rm -f "$RES_DIR"/drawable-v24/ic_launcher_foreground.xml

            for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              folder="${entry%%:*}"
              size="${entry##*:}"
              mkdir -p "$RES_DIR/mipmap-$folder"
              convert "$ICON_SRC" -resize "${size}x${size}" "$RES_DIR/mipmap-$folder/ic_launcher.png"
              convert "$ICON_SRC" -resize "${size}x${size}" "$RES_DIR/mipmap-$folder/ic_launcher_round.png"
              convert "$ICON_SRC" -resize "${size}x${size}" "$RES_DIR/mipmap-$folder/ic_launcher_foreground.png"
            done
          fi

      # 6. فرض الاسم
      - name: Enforce App Name
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">BIMcraft<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">BIMcraft<\/string>/g' android/app/src/main/res/values/strings.xml

      # 7. حل تعارض كوتلن
      - name: Fix Kotlin Duplicate Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("align with kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("align with kotlin-stdlib")
                  }
              }
          }
          EOF

      # 8. البناء والتوقيع بشهادة رقمية
      - name: Build and Sign Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          keytool -genkey -v -keystore craft.keystore -alias craft -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Craft, OU=Craft, O=Craft, L=Cairo, S=Cairo, C=EG"
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -r | head -n 1)
          $APKSIGNER sign --ks craft.keystore --ks-pass pass:123456 --key-pass pass:123456 $APK_PATH

      # 9. الرفع
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: BIMcraft-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
