name: Build BIMcraft APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Rust & WASM
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Install Trunk & Image Tools
        run: |
          cargo install --locked trunk
          sudo apt-get update && sudo apt-get install -y imagemagick

      # 1. خفض قيود الرسوميات لدعم الـ 3D المعماري على الموبايل
      - name: Patch GPU Limits for BIMcraft
        run: |
          echo "Patching WGPU texture limit to 4096..."
          find apps crates -type f -name "*.rs" -exec sed -i 's/8192/4096/g' {} + || true
          
          python3 -c '
          import os, glob
          for path in glob.glob("**/*.rs", recursive=True):
              if "target/" in path: continue
              with open(path, "r") as f:
                  content = f.read()
              if "wgpu_options" in content or "WebOptions" in content or "eframe::WebRunner" in content:
                  content = content.replace("wgpu::Limits::default()", "wgpu::Limits::downlevel_defaults()")
                  content = content.replace("wgpu::Limits::downlevel_webgl2_defaults()", "wgpu::Limits::downlevel_defaults()")
                  with open(path, "w") as f:
                      f.write(content)
          '

      # 2. إنشاء ملف index.html بالبايثون وبناء الويب
      - name: Build Web Bundle
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          TARGET_DIR="."
          if [ -d "apps/bimcraft-web" ]; then TARGET_DIR="apps/bimcraft-web";
          elif [ -d "apps/bimcraft" ]; then TARGET_DIR="apps/bimcraft";
          elif [ -d "apps/web" ]; then TARGET_DIR="apps/web";
          fi
          
          echo "Moving to $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # استخدام بايثون لكتابة الملف بشكل آمن
          python3 -c '
          import os
          if not os.path.exists("index.html"):
              print("Generating generic index.html for BIMcraft...")
              html_content = """<!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>BIMcraft</title>
              <style>html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow:
